# =============================================================================
# 生产 PostgreSQL 的客户端认证规则（公开分发，不含任何凭据）
#
# 由 docker-compose.prod.yml 通过 `-c hba_file=/etc/rm-tls/pg_hba.conf` 挂载启用。
#
# 策略（fail-closed）：只接受 TLS 连接（hostssl），并显式 reject 明文连接
# （hostnossl），而不是「允许 TLS 但也允许明文」——后者会让一次配置疏忽
# 静默退化成明文传输。
#
# 认证方式用 scram-sha-256（口令不以明文保存在 pg_hba 里，口令本身在
# POSTGRES_PASSWORD 环境变量中）。若改用客户端证书（cert），需要
# 同时把 ssl_ca_file 配好并让客户端证书 CN 与数据库用户名一致。
#
# 字段顺序：type  database  user  address  method
# =============================================================================

# 容器内本地 socket 连接：同样要求口令，避免「进了容器就免密」
local   all             all                                     scram-sha-256

# 仅 TLS 的 TCP 连接（编排网络内的 api 容器）
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256

# 明文 TCP 连接一律拒绝（这是 TLS 强制的最后一道闸门）
hostnossl all           all             all                     reject
