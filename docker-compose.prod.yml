# ============================================================================
# Researcher Manager —— 生产编排（单主机 / WSL2 或 Linux 主机）
#
# 与 `docker-compose.yml`（本地开发档）**分开维护**，不用 `-f` 叠加，原因：
#   - 生产需要的差异是「结构性」的（TLS 档位、证书挂载、不发布数据库端口、
#     必填的取证变量），叠加式覆盖对 `ports` 这类序列字段是**追加**而不是替换，
#     很容易在评审时看错最终结果；独立文件让 `docker compose -f ... config`
#     的输出就是最终事实。
#   - 两份文件的服务集合与卷名保持一致，由 `pnpm verify:docker` 静态比对守护。
#
# 启动：
#   docker compose -f docker-compose.prod.yml --env-file .env.docker.prod up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.docker.prod ps
#
# 【fail-closed 设计】本文件里所有机密与取证事实都用 `${VAR:?}` 声明为**必填**：
# 缺任何一项，Compose 在解析阶段就报错退出，绝不带着空值/默认口令启动。具体地：
#   - POSTGRES_* / DATABASE_URL / SESSION_SECRET：没有内置默认值；
#   - DATABASE_SSL_MODE 在编排里**写死 verify-full**，不能用环境变量降级成
#     disable/require（应用侧也会独立拒绝：NODE_ENV=production 时非 verify-full 一律
#     拒绝启动，见 services/api/src/db/config/database-config.ts）；
#   - DATABASE_EXECUTOR_* / DATABASE_SCHEMA_* / DATABASE_MIGRATION_*：SQL 执行器的
#     取证事实必须由**真的做过验证的人或 CI**填写（代码不会生成「已验证」），
#     缺失时应用在任何数据库连接之前终止启动；
#   - 证书只登记**路径**，内容来自 `${RM_TLS_DIR}` 的只读挂载，绝不写入仓库。
#
# 【TLS 拓扑】两端都显式启用 TLS：
#   - postgres：`ssl=on` + 服务端证书从 `${RM_TLS_DIR}` 挂载，并用随仓库公开分发的
#     `db/docker/prod/pg_hba.conf`（`hba_file=`）**只接受 hostssl**、显式 reject 明文连接；
#   - api：`DATABASE_SSL_MODE=verify-full`（校验证书链与主机名），CA 来自同一挂载。
#   证书文件必须对容器内的 postgres/node 用户可读（见 DOCKER.md「证书准备」）。
#
# 【容器加固（生产审计口径）】两个服务都按同一组声明收紧，每条都由 `pnpm verify:docker`
# 的静态断言逐条复核（断言实现见 scripts/docker-packaging-check.mjs）：
#   - read_only: true                       根文件系统只读，进程无法改写镜像内容；
#   - cap_drop: [ALL]                       去掉全部 Linux capability；
#   - security_opt: no-new-privileges:true  禁止通过 setuid / 文件能力提权；
#   - user: <显式非 root>                   不依赖镜像默认身份（镜像默认是 root）；
#   - tmpfs                                 只读根下**真正需要写**的目录才用 tmpfs 提供。
#
# 【可写路径清单（有意为之，其余位置都不允许写）】
#   - api      ：**没有**可写路径。@rm/api 运行时代码只读文件（迁移 SQL、契约夹具），日志只
#                写 stdout；健康探针不写文件、不打印环境变量取值。因此 api **不**声明
#                tmpfs / 可写卷：每多一个可写路径就多一个可被写入的攻击面。
#   - postgres ：数据卷 rm-postgres-data（**必须可写**，且不允许是 tmpfs）
#                + tmpfs /run/postgresql（Unix socket 目录）、tmpfs /tmp（TMPDIR）。
#   - 证书目录 ${RM_TLS_DIR} 始终**只读挂载**（/etc/rm-tls:ro），绝不改成 tmpfs：
#     它是身份与机密材料，不是临时目录；数据卷同理，改成 tmpfs 就是丢数据。
#
# 【运行身份没有变化，只是写显式了】加固前：api 已在 Dockerfile 里 `USER node`（uid 1000），
# postgres 以 root 进入官方 entrypoint 后立刻 `exec gosu postgres`（uid 70）。加固后两者都以
# 同一个 uid 直接启动，**有效运行身份不变**，因此证书可读性要求（DOCKER.md「证书准备」：
# 证书文件须对容器内 node/postgres 用户可读）与 TLS 行为都不受影响。
#
# 【postgres 为什么可以 cap_drop: [ALL] 且不需要任何 cap_add】
# 依据官方 postgres:16-alpine 的 docker-entrypoint.sh（docker-library/postgres 16/alpine*）：
#   - chown / gosu 提权分支只在 `id -u` = 0 时执行（需要 CHOWN/DAC_OVERRIDE/FOWNER/SETUID/SETGID）；
#     本文件用 user: "postgres" 直接以非 root 启动，这些分支根本不会执行；
#   - 非 root 分支只做 mkdir/chmod，且 `chmod 03775 /var/run/postgresql` 的失败被 `|| :` 吞掉
#     （上游 docker-library/postgres#853 记为可忽略）；
#   - initdb / postgres 服务端本身不使用任何 Linux capability（上游 docker-library/postgres#649
#     中两个独立用户在 postgres:16 + 非 root + cap_drop ALL + read_only 下实测启动成功）。
# 代价是**运维前提**（不是能力需求）：数据卷必须归 postgres 用户所有。本编排的具名卷首次创建时
# 会继承镜像内 /var/lib/postgresql/data 的所有权（构建期 chown postgres:postgres、chmod 1777），
# 天然满足；若该卷曾经被 root 写过，需先：
#   docker run --rm -v researcher-manager-prod_rm-postgres-data:/v alpine chown -R 70:70 /v
#
# 【禁止机密进日志】command / entrypoint / healthcheck 里不得出现任何机密类变量引用——这些内容
# 会出现在 `docker inspect`、`docker ps` 与容器日志里；机密只允许经 environment 注入（该通道
# 本身不进日志）。探针脚本只输出状态码与路径，绝不打印环境变量取值。
#
# 【未做的验证，如实声明】本构建环境没有可用的 Docker 守护进程：早期的编排版本做过
# `docker compose ... config` 静态渲染校验，但**本次加固修订没有重跑** `config`，也**没有**做过
# 真实启动/连通性验证。本修订可复核的证据只有：`pnpm verify:docker` 的逐条静态断言
# （含 --self-test 与合成反例）、prettier 的 YAML 解析通过、以及上游 entrypoint 源码与
# docker-library/postgres#649 / #853 的能力与可写路径分析（见上）。真实启动必须在有 Docker
# 守护进程的机器上另行验证，尤其是：postgres 以非 root + cap_drop ALL 首次初始化数据卷。
# ============================================================================

name: researcher-manager-prod

networks:
  rm-internal:
    driver: bridge

volumes:
  rm-postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?生产必须显式提供 POSTGRES_USER（无默认值）}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?生产必须显式提供 POSTGRES_PASSWORD（无默认值）}"
      POSTGRES_DB: "${POSTGRES_DB:?生产必须显式提供 POSTGRES_DB（无默认值）}"
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/rm-tls/server.crt
      - -c
      - ssl_key_file=/etc/rm-tls/server.key
      - -c
      - ssl_ca_file=/etc/rm-tls/ca.pem
      # 只接受 TLS：明文 host 连接被显式拒绝（见该文件内的 hostssl / hostnossl 规则）
      - -c
      - hba_file=/etc/rm-tls/pg_hba.conf
    networks:
      - rm-internal
    # 生产**不**把数据库端口发布到宿主机：只允许编排网络内的 api 访问
    expose:
      - "5432"
    volumes:
      - rm-postgres-data:/var/lib/postgresql/data
      - "${RM_TLS_DIR:?生产必须通过 RM_TLS_DIR 提供证书目录（绝对路径）}:/etc/rm-tls:ro"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # 【容器加固】只读根 + 去能力 + 显式非 root（见文件头「postgres 为什么可以 cap_drop: [ALL]」）。
    # user 用镜像内的 postgres 用户（postgres:16-alpine 解析为 uid 70:gid 70）：非 root 启动时官方
    # entrypoint 不执行 chown/gosu 分支，所以不需要任何 cap_add；数据卷必须已归该 uid 所有。
    user: "postgres"
    read_only: true
    cap_drop:
      - ALL
    # 只读根下**仅**这两个目录需要可写，且都不能留在根文件系统上：
    #   - /run/postgresql：postgres 启动时必须在此创建 Unix socket（alpine 里 /var/run → /run）；
    #   - /tmp：TMPDIR（官方 entrypoint 的 mktemp 分支、psql/initdb 工具链的临时文件）。
    # 数据目录 /var/lib/postgresql/data **不在此列**：它必须在可写的具名卷上（见上面 volumes），
    # PostgreSQL 自己的排序/临时文件也写在数据卷内，不依赖 /tmp。
    tmpfs:
      - /run/postgresql
      - /tmp
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      API_HOST: "0.0.0.0"
      API_PORT: "3000"
      API_PREFIX: "${API_PREFIX:-/api/v1}"
      API_PUBLIC_URL: "${API_PUBLIC_URL:?生产必须显式提供对外地址 API_PUBLIC_URL（用于日志与导出链接）}"
      # 连接串指向编排网络内的 postgres；sslmode 与下面的显式档位同义
      DATABASE_URL: "${DATABASE_URL:?生产必须显式提供 DATABASE_URL（无默认值）}"
      # 写死 verify-full：生产只接受可校验证书链与主机名的 TLS，不可用环境变量降级
      DATABASE_SSL_MODE: verify-full
      DATABASE_SSL_CA_PATH: "/etc/rm-tls/ca.pem"
      # 双向 TLS（可选）：留空即不使用客户端证书；证书与私钥必须成对（应用侧校验）
      DATABASE_SSL_CERT_PATH: "${RM_TLS_CLIENT_CERT_PATH:-}"
      DATABASE_SSL_KEY_PATH: "${RM_TLS_CLIENT_KEY_PATH:-}"
      DATABASE_APPLICATION_NAME: "${DATABASE_APPLICATION_NAME:-researcher-manager-api}"
      SESSION_SECRET: "${SESSION_SECRET:?生产必须显式提供 SESSION_SECRET（至少 32 字节随机值）}"
      # ---- SQL 执行器取证事实（CI / 运维填写，缺失即 fail-closed）----
      DATABASE_EXECUTOR_EVIDENCE_ID: "${DATABASE_EXECUTOR_EVIDENCE_ID:?执行器取证事实缺失：必须由已完成的验证填写}"
      DATABASE_EXECUTOR_VERIFIED_BY: "${DATABASE_EXECUTOR_VERIFIED_BY:?执行器取证事实缺失：必须填写验证人/任务标识}"
      DATABASE_EXECUTOR_VERIFIED_AT: "${DATABASE_EXECUTOR_VERIFIED_AT:?执行器取证事实缺失：必须填写验证时间}"
      DATABASE_EXECUTOR_EVIDENCE_REF: "${DATABASE_EXECUTOR_EVIDENCE_REF:?执行器取证事实缺失：必须填写可核对引用（CI 链接/用例路径）}"
      DATABASE_EXECUTOR_EVIDENCE_METHOD: "${DATABASE_EXECUTOR_EVIDENCE_METHOD:?执行器取证事实缺失：必须填写 integration-test / contract-test / manual-review}"
      DATABASE_SCHEMA_READINESS_ID: "${DATABASE_SCHEMA_READINESS_ID:?schema 就绪事实缺失：必须由迁移核对结果填写}"
      DATABASE_SCHEMA_CHECKED_BY: "${DATABASE_SCHEMA_CHECKED_BY:?schema 就绪事实缺失：必须填写核对人/任务标识}"
      DATABASE_SCHEMA_CHECKED_AT: "${DATABASE_SCHEMA_CHECKED_AT:?schema 就绪事实缺失：必须填写核对时间}"
      DATABASE_SCHEMA_READINESS_REF: "${DATABASE_SCHEMA_READINESS_REF:?schema 就绪事实缺失：必须填写可核对引用}"
      DATABASE_MIGRATION_AVAILABLE_VERSIONS: "${DATABASE_MIGRATION_AVAILABLE_VERSIONS:?迁移版本事实缺失：必须填写代码侧可用版本}"
      DATABASE_MIGRATION_APPLIED_VERSIONS: "${DATABASE_MIGRATION_APPLIED_VERSIONS:?迁移版本事实缺失：必须按 pnpm db:migrate:status 的真实输出填写}"
      AI_PROVIDER: "${AI_PROVIDER:-disabled}"
      AI_MATCHING_ENABLED: "${AI_MATCHING_ENABLED:-false}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
    networks:
      - rm-internal
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # 只读挂载证书：内容绝不写入镜像/仓库，只登记路径
      - "${RM_TLS_DIR:?生产必须通过 RM_TLS_DIR 提供证书目录（绝对路径）}:/etc/rm-tls:ro"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.mjs"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # 【容器加固】只读根 + 去能力 + 显式非 root（与 Dockerfile 里的 `USER node` 一致，两处都要有：
    # 镜像默认身份 + 编排里的显式声明互相印证，缺一处就会被 pnpm verify:docker 拦下）。
    user: "node"
    read_only: true
    cap_drop:
      - ALL
    # 刻意**不**声明 tmpfs / 可写卷：运行时代码只读文件、只写 stdout，探针不写文件也不打印
    # 环境变量取值，所以这里没有任何必要可写路径；多声明一个就是白送一个可写面。
    restart: always
